name: Keepalive — Supabase Free Plan

on:
  schedule:
    # Jalankan setiap 3 hari jam 08:00 UTC (biar project ga sleep)
    - cron: "0 8 */3 * *"
  workflow_dispatch: # bisa trigger manual juga

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://lhpickvmnurgcduvfskz.supabase.co" \
            || echo "Supabase tidak merespon (masih sleep?)"
