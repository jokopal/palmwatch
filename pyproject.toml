[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palmwatch"
version = "0.1.0"
description = "Precision Intelligence untuk Perkebunan Kelapa Sawit"
authors = [
    {name = "PalmWatch Team", email = "team@palmwatch.id"},
]
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "earthengine-api>=0.1.380",
    "google-auth>=2.0.0",
    "requests>=2.31.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0",
    "rasterstats>=0.19.0",
    "pyproj>=3.6.0",
    "tqdm>=4.66.0",
    "retry>=0.9.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "sentry-sdk>=2.0.0",
    "redis>=5.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
